<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print {{ cis|length }} Commission Invoice(s)</title>
  <link rel="stylesheet" href="/static/po_wysiwyg.css" />
  <link rel="stylesheet" href="/static/ci_wysiwyg.css?v=2.7" />
  <link rel="stylesheet" href="/static/ci_template_us.css?v=3.2" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
    .ci-print-toolbar {
      max-width: 7.5in;
      margin: 0.75rem auto;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .ci-print-toolbar .btn {
      display: inline-block;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      cursor: pointer;
    }
    .ci-print-toolbar .btn-primary {
      background: #1a5632;
      color: #fff;
      border-color: #1a5632;
    }
    .ci-print-shell {
      max-width: 7.5in;
      margin: 0 auto 2rem;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .ci-bulk-break { page-break-after: always; }
    @media print {
      body { background: #fff !important; }
      .ci-print-toolbar { display: none !important; }
      .ci-print-shell { box-shadow: none !important; margin: 0 !important; max-width: none !important; }
    }
  </style>
</head>
<body>
{% from "generate/commission_invoices/_ci_body.html" import ci_body %}
{% set _base = ci_base or '/generate/commission-invoices' %}

<div class="ci-print-toolbar no-print">
  <a href="{{ _base }}" class="btn">← Back</a>
  <button type="button" onclick="window.print()" class="btn btn-primary">Print / Save PDF</button>
  <span style="font-size:0.85rem;color:#64748b">{{ cis|length }} invoice(s) selected</span>
</div>

{% for ci in cis %}
<div class="ci-print-shell {% if not loop.last %}ci-bulk-break{% endif %}">
  {{ ci_body(ci, readonly=true) }}
</div>
{% endfor %}

<script>
window.addEventListener("load", function () {
  setTimeout(function () { window.print(); }, 600);
});
</script>
</body>
</html>
